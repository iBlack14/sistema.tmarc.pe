c<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Mesa de Partes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #000000;
        }

        .error-container {
            background: #ffffff;
            border-radius: 15px;
            border: 2px solid #C0C0C0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 40px;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #C0C0C0;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .error-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #000000;
        }

        .error-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #333333;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #000000;
            color: #C0C0C0;
        }

        .btn-primary:hover {
            background: #333333;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #C0C0C0;
            border: 1px solid #C0C0C0;
        }

        .btn-secondary:hover {
            background: #C0C0C0;
            color: #000000;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 480px) {
            .error-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .error-code {
                font-size: 56px;
            }

            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-message">
            La página que estás buscando no existe o ha sido movida a otra ubicación.
        </p>
        <div class="error-actions">
            <a href="login.html" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                Ir al Login
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Volver atrás
            </a>
        </div>
    </div>
</body>
</html>
