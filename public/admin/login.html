<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/img/logo.png">
<script src="js/utils.js"></script>
<style>
    :root {
        --color-gold: #d4af37;
        --color-gold-satin: #f1d582;
        --color-silver: #C0C0C0;
        --color-dark: #0a0a0a;
        --color-surface: rgba(15, 15, 15, 0.8);
        --font-main: 'Outfit', sans-serif;
        --shadow-premium: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 50px rgba(212, 175, 55, 0.15);
        --transition-smooth: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: var(--font-main);
        background: #050505 url('../../assets/img/login.png') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: white;
        overflow: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.95) 100%);
        z-index: 0;
    }

    .login-container {
        background: var(--color-surface);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 40px;
        border: 1px solid rgba(212, 175, 55, 0.25);
        box-shadow: var(--shadow-premium);
        width: 100%;
        max-width: 480px;
        position: relative;
        z-index: 1;
        animation: containerReveal 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        padding: 60px 50px;
    }

    @keyframes containerReveal {
        from {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            filter: blur(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }
    }

    .login-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .admin-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid rgba(212, 175, 55, 0.4);
        padding: 10px 20px;
        border-radius: 100px;
        font-size: 12px;
        font-weight: 600;
        color: var(--color-gold);
        text-transform: uppercase;
        letter-spacing: 2.5px;
        margin-bottom: 25px;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }

    .login-header h1 {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1.5px;
        margin-bottom: 10px;
        background: linear-gradient(to right, #fff 0%, var(--color-silver) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .login-header p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 15px;
        font-weight: 300;
    }

    .security-notice {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 18px;
        padding: 15px;
        margin-bottom: 35px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-label {
        display: block;
        color: var(--color-gold);
        margin-bottom: 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .input-container {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--color-gold);
        opacity: 0.4;
        transition: var(--transition-smooth);
    }

    .form-input {
        width: 100%;
        padding: 18px 20px 18px 54px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-family: inherit;
        transition: var(--transition-smooth);
    }

    .form-input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.07);
        border-color: var(--color-gold);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .form-input:focus+.input-icon {
        opacity: 1;
        color: var(--color-gold-satin);
    }

    .login-btn {
        width: 100%;
        padding: 20px;
        background: linear-gradient(135deg, var(--color-gold) 0%, #c49a2d 100%);
        border: none;
        border-radius: 18px;
        color: var(--color-dark);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
    }

    .login-btn:hover:not(:disabled) {
        transform: translateY(-4px);
        box-shadow: 0 20px 50px rgba(212, 175, 55, 0.45);
        filter: brightness(1.05);
    }

    .login-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .back-link {
        text-align: center;
        margin-top: 40px;
    }

    .back-link a {
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
        font-size: 14px;
        transition: var(--transition-smooth);
    }

    .back-link a:hover {
        color: var(--color-gold);
    }

    .error-message,
    .success-message {
        border-radius: 16px;
        padding: 16px 20px;
        margin-bottom: 25px;
        font-size: 14px;
        display: none;
        animation: messageReveal 0.5s var(--transition-smooth);
    }

    @keyframes messageReveal {
        from {
            opacity: 0;
            transform: scale(0.95);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .error-message {
        background: rgba(244, 67, 54, 0.1);
        border: 1px solid rgba(244, 67, 54, 0.3);
        color: #ff8a80;
    }

    .success-message {
        background: rgba(76, 175, 80, 0.1);
        border: 1px solid rgba(76, 175, 80, 0.3);
        color: #b9f6ca;
    }

    .loader {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: var(--color-dark);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
    <title>Acceso de Seguridad | Panel Administrativo TMARC</title>
    <meta name="description" content="Portal de acceso seguro para la gestión judicial administrativa del sistema TMARC.">
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="admin-badge">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                </svg>
                Control Administrativo
            </div>
            <h1>Gestión Judicial</h1>
            <p>Portal Institucional TMARC</p>
        </div>

        <form id="loginForm" class="login-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="form-group">
                <label class="form-label">USUARIO</label>
                <div class="input-container">
                    <input type="text" id="username" class="form-input" placeholder="ID Administrador" required
                        autocomplete="username">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">CONTRASEÑA</label>
                <div class="input-container">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="current-password">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path
                                d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span>AUTENTICAR ACCESO</span>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                </svg>
            </button>

            <div class="back-link">
                <a href="../../login.html">← Retornar al portal público</a>
            </div>
        </form>
    </div>

    <script>
        class AdminAuthSystem {
            constructor() { this.init(); }
            async init() {
                const userData = await getSecureItem('userData');
                if (userData) {
                    try {
                        if (userData.tipo === 'admin') window.location.href = '/public/admin/index.html';
                        else this.limpiarSesion();
                    } catch (e) { this.limpiarSesion(); }
                }
            }

            async login(username, password) {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernameOEmail: username, password: password })
                    });
                    const data = await response.json();
                    if (!data.success) {
                        return { success: false, message: data.error || 'Credenciales inválidas' };
                    }
                    const usuario = data.data.usuario;
                    if (usuario.tipo !== 'admin') {
                        return { success: false, message: '⚠️ Acceso restringido a nivel administrativo.' };
                    }
                    // Guardar datos cifrados y ESPERAR a que terminen
                    await setSecureItem('authToken', data.data.token);
                    await setSecureItem('userData', usuario);
                    await setSecureItem('userId', usuario.id.toString());

                    // Verificar que se guardaron correctamente
                    const verify = await getSecureItem('authToken');
                    if (!verify) {
                        console.error('❌ Error: datos de sesión no se guardaron correctamente');
                        return { success: false, message: 'Error guardando sesión segura. Intente de nuevo.' };
                    }
                    return { success: true, message: `Bienvenido, ${usuario.nombre}` };
                } catch (e) {
                    console.error('Login error:', e);
                    return { success: false, message: 'Error de conexión con el servidor judicial.' };
                }
            }

            limpiarSesion() {
                ['authToken', 'userData', 'userId', 'user', 'usuarioActual'].forEach(k => sessionStorage.removeItem(k));
            }

            mostrarMensaje(tipo, mensaje) {
                const err = document.getElementById('errorMessage'), suc = document.getElementById('successMessage');
                err.style.display = 'none'; suc.style.display = 'none';
                if (tipo === 'error') { err.textContent = mensaje; err.style.display = 'block'; }
                else { suc.textContent = mensaje; suc.style.display = 'block'; }
            }
        }

        const auth = new AdminAuthSystem();
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div><span>Verificando...</span>';

            const res = await auth.login(user, pass);
            if (res.success) {
                auth.mostrarMensaje('success', res.message);
                // Esperar un momento para mostrar el mensaje, luego redirigir
                await new Promise(r => setTimeout(r, 600));
                window.location.href = '/public/admin/index.html';
            } else {
                auth.mostrarMensaje('error', res.message);
                btn.disabled = false;
                btn.innerHTML = '<span>AUTENTICAR ACCESO</span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>';
            }
        });
    </script>
</body>
</html>
