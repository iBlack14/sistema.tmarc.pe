<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ TMARC | Sistema Judicial Institucional</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">

    <!-- UI-UX-PRO-MAX Engine -->
    <link rel="stylesheet" href="assets/css/base-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/components-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/modal-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/tables-premium.css?v=5.0">

    <!-- External Libs -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="conexion-datos.js?v=5.0"></script>
</head>

<body class="pro-max-theme">

    <!-- Background Accents -->
    <div class="bg-glow"></div>

    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; gap: 15px;">
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid var(--color-surface-soft); border-top: 5px solid var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <span style="font-family: var(--font-header); font-weight: 700; color: var(--color-primary); letter-spacing: 1px;">CARGANDO SISTEMA...</span>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <div class="dashboard-wrapper">
        <!-- Main Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/img/logo.png" alt="TMARC Logo" class="sidebar-logo-img" style="height: 45px; width: auto; object-fit: contain;">
            <button class="toggle-btn" id="sidebar-toggle">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                </svg>
            </button>
        </div>

        <div class="user-profile">
            <div class="user-avatar" id="userAvatar">
                <img id="userPhoto" src="assets/img/default-avatar.svg" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none;">
                <svg id="userDefaultAvatar" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="user-info">
                <div class="user-name" id="userName">Cargando...</div>
                <div class="user-status"><span class="pulse-dot"></span> Online</div>
            </div>
        </div>

        <nav class="nav-menu">
            <!-- Dynamically generated items -->
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="content-container">
            <header class="top-bar glass-panel">
                <div class="search-bar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" placeholder="Buscar expedientes, notificaciones..." id="global-search">
                </div>
                <div class="top-actions">
                    <div class="notification-container" style="position: relative; display: inline-block;">
                        <button class="icon-btn" id="btn-notification-bell" title="Notificaciones" style="position: relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
                            </svg>
                            <span id="notif-badge" style="position: absolute; top: -5px; right: -5px; background: var(--color-error); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: none; align-items: center; justify-content: center; font-weight: 800; border: 2px solid var(--color-surface);"></span>
                        </button>
                        <div id="notification-dropdown" class="glass-panel notification-dropdown" style="display: none;">
                            <div class="dropdown-header">
                                <h3>Notificaciones</h3>
                                <span id="dropdown-mark-read" onclick="window.dashboardApp.markAllNotificationsRead(event)">Marcar todo como leído</span>
                            </div>
                            <div id="dropdown-list" class="dropdown-list">
                                <!-- Se llena dinámicamente -->
                            </div>
                            <div class="dropdown-footer">
                                <a href="#casilla" onclick="showSection('casilla', event); window.dashboardApp.closeNotificationDropdown();">Ver todas las notificaciones</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div id="content-area" class="fade-in">
                <!-- Sections will be injected here -->
            </div>
        </div>
    </main>
</div>

<!-- Modal System -->
    <div class="modal-overlay" id="modalGeneral">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <span id="modalTitle">Detalles del Proceso</span>
                <button class="modal-close" onclick="closeAllModals()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be injected -->
            </div>
        </div>
    </div>

    <!-- Modal para Nueva Solicitud (Premium) -->
    <div class="modal-overlay" id="modalSolicitud">
        <div class="modal-content glass-panel" style="max-width: 850px; padding: 0; overflow: hidden;">
            <div class="modal-header" style="padding: 24px 32px; background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="width: 40px; height: 40px; background: var(--color-primary); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">📜</div>
                    <div>
                        <h2 style="margin: 0; font-family: var(--font-title); font-size: 20px; color: var(--color-primary);">Nueva Solicitud Institucional</h2>
                        <p style="margin: 0; font-size: 12px; color: var(--color-text-muted);">Mesa de Partes Virtual - TMARC</p>
                    </div>
                </div>
                <button class="modal-close" onclick="closeAllModals()">×</button>
            </div>

            <div class="modal-body" style="padding: 32px;">
            <form id="formSolicitud">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <!-- Columna 1: Datos Personales -->
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <h4 style="margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-primary);">👤 Identificación</h4>
                        
                        <div class="form-group">
                            <label class="stat-label">Nombre Completo / Razón Social</label>
                            <input type="text" id="solicitanteNombre" class="form-input" placeholder="Ej. Juan Pérez o Empresa S.A.C" required>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label class="stat-label">DNI / RUC</label>
                                <input type="text" id="solicitanteDni" class="form-input" placeholder="00000000" required>
                            </div>
                            <div class="form-group">
                                <label class="stat-label">Teléfono / WhatsApp</label>
                                <input type="tel" id="solicitanteTelefono" class="form-input" placeholder="+51 900...">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="stat-label">Correo Electrónico de Notificación</label>
                            <input type="email" id="solicitanteEmail" class="form-input" placeholder="usuario@ejemplo.com">
                        </div>

                        <div class="form-group">
                            <label class="stat-label">Casilla Electrónica (Opcional)</label>
                            <input type="text" id="casillaElectronica" class="form-input" placeholder="S-00000" value="53099">
                        </div>

                        <div class="form-group">
                            <label class="stat-label">Nombre del Demandado / Contraparte</label>
                            <input type="text" id="demandadoNombre" class="form-input" placeholder="Nombre o razón social de la contraparte">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label class="stat-label">DNI / RUC Demandado</label>
                                <input type="text" id="demandadoDni" class="form-input" placeholder="00000000">
                            </div>
                            <div class="form-group">
                                <label class="stat-label">Correo Demandado</label>
                                <input type="email" id="demandadoEmail" class="form-input" placeholder="correo@ejemplo.com">
                            </div>
                        </div>
                    </div>

                    <!-- Columna 2: Detalle del Trámite -->
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <h4 style="margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-primary);">⚖️ Asunto y Documentación</h4>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label class="stat-label">Tipo de Solicitud</label>
                                <select id="tipoSolicitud" class="form-select">
                                    <option value="arbitraje">Arbitraje</option>
                                    <option value="jprd">Junta de Prevención y Resolución de Disputas</option>
                                    <option value="conciliacion">Conciliación Extrajudicial</option>
                                    <option value="arbitraje-emergencia">Arbitraje de Emergencia</option>
                                    <option value="arbitraje-express">Arbitraje Express</option>
                                    <option value="arbitraje-privados">Arbitraje entre Privados</option>
                                    <option value="formacion-capacitacion">Centro de Formación y Capacitación</option>
                                    <option value="otro">Otro</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="stat-label">Prioridad</label>
                                <select id="prioridadSolicitud" class="form-select">
                                    <option value="normal">Normal</option>
                                    <option value="alta">Alta</option>
                                    <option value="urgente">Urgente</option>
                                </select>
                            </div>
                        </div>

                        <div id="otrosContainer" style="display: none;" class="form-group">
                            <label class="stat-label">Especifique Tipo</label>
                            <input type="text" id="otrosTipo" class="form-input" placeholder="¿Qué tipo de solicitud es?">
                        </div>

                        <div class="form-group">
                            <label class="stat-label" style="display: flex; justify-content: space-between;">
                                Asunto Breve 
                                <span id="charCount" style="font-size: 10px; opacity: 0.6;">0</span>
                            </label>
                            <input type="text" id="asuntoSolicitud" class="form-input" placeholder="Ej. Presentación de Escrito Nº 01" maxlength="100">
                        </div>

                        <div class="form-group">
                            <label class="stat-label">Descripción Detallada</label>
                            <textarea id="descripcionSolicitud" class="form-input" style="min-height: 100px; resize: none;" placeholder="Describa el motivo de su presentación..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Zona de Carga de Archivos -->
                <div style="margin-top: 24px; padding: 20px; background: rgba(212, 175, 55, 0.05); border-radius: 16px; border: 1px dashed var(--color-primary);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <label class="stat-label">📄 Documento Principal (PDF, Word, etc.)</label>
                            <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
                                <button type="button" class="btn btn-secondary" onclick="document.getElementById('documentoPrincipal').click()" style="padding: 8px 16px; font-size: 12px;">Seleccionar Archivo</button>
                                <span id="fileNamePrincipal" class="text-muted" style="font-size: 11px;">Ningún archivo seleccionado</span>
                                <input type="file" id="documentoPrincipal" style="display: none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
                            </div>
                        </div>
                        <div>
                            <label class="stat-label" style="display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox" id="checkAnexos" onchange="window.solicitudesModule?.toggleAnexosContainer(event)">
                                ¿Adjuntar Anexos?
                            </label>
                            <div id="anexosContainer" style="display: none; margin-top: 8px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('anexosFiles').click()" style="padding: 8px 16px; font-size: 12px;">Añadir Archivos</button>
                                    <span id="fileNameAnexos" class="text-muted" style="font-size: 11px;">0 archivos</span>
                                    <input type="file" id="anexosFiles" style="display: none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" multiple>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="anexosList" style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
                </div>

                <div style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="closeAllModals()" style="padding: 12px 24px;">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="padding: 12px 40px; font-weight: 600;">🚀 Enviar Solicitud Institucional</button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <!-- Scripts Architecture -->
    <script src="assets/js/config/dashboard-config.js?v=7.0"></script>
    <script src="assets/js/dashboard-core.js?v=7.0"></script>
    <script>
        // Initialize Core Engine
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboardApp = new DashboardApp();
        });

        // Bridge functions
        function showSection(id, e) { window.dashboardApp.showSection(id, e); }
        function logout() { window.dashboardApp.logout(); }
        function closeAllModals() { window.dashboardApp.closeAllModals(); }
    </script>
    <script src="assets/js/dashboard-sections.js?v=7.0"></script>

    <!-- Modules -->
    <script src="assets/js/modules/solicitudes.js?v=7.0"></script>
    <script src="assets/js/modules/notificaciones.js?v=7.0"></script>
    <script src="assets/js/modules/expedientes.js?v=7.0"></script>
    <script src="assets/js/modules/configuracion.js?v=7.0"></script>
    <script src="assets/js/modules/mesa-partes.js?v=7.0"></script>

    <!-- Toast Notifications Container -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

    <style>
        .toast {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-left: 5px solid var(--color-primary);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: var(--color-text);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
        }
        .toast.active { transform: translateX(0); }
        .toast.success { border-left-color: #4CAF50; }
        .toast.error { border-left-color: #f44336; }
        .toast.info { border-left-color: var(--color-primary); }
        .toast-icon { font-size: 20px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>


</body>
</html>
